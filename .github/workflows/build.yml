# 建置驗證
#
# 分成兩個 job，因為兩者的成本差了一個數量級：
#
#   web  在 ubuntu 上跑，幾十秒就結束，每次 push 都跑。
#   ios  必須在 macOS 上跑 —— Xcode 只存在於 macOS，Linux 沒有任何辦法編出
#        iOS 執行檔。公開 repo 用標準 runner 免費（含 macOS）；如果哪天這個
#        repo 轉私有，macOS 的分鐘數是 10 倍計費，那時要改成只在 tag 上跑。
#
# iOS 這一段建的是**實機版但不簽章**，產出一顆未簽章的 IPA。
#
# 為什麼不建模擬器版：模擬器跑的是 x86_64／arm64-sim，跟 iPhone 的 arm64
# 是不同架構，編得過不代表實機編得過。實機版才是有意義的檢查，順便拿得到 IPA。
#
# 未簽章的 IPA 裝不上一般 iPhone —— iOS 拒絕執行未簽章的程式碼。它的用途是
# 當起點：用免費 Apple ID 透過 Sideloadly／AltStore 自己重簽（7 天到期、
# 最多 3 個 App），或等有了開發者帳號之後正式簽章。簽章需要憑證與
# provisioning profile，那是 CI 繞不過的，見 RELEASE.md。

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 部署需要的權限。預設的 GITHUB_TOKEN 只有讀取權，少了這三項
# deploy-pages 會以 403 失敗。id-token 是給 Pages 的 OIDC 驗證用的。
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  web:
    name: 型別與網頁打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: 型別檢查
        run: npm run typecheck

      - name: 網頁打包
        run: npm run build

      # 關卡表是生成出來的，而且遊戲的核心保證是「每一關都有唯一解」。
      # 這個檢查很便宜，卻能擋掉最難用眼睛看出來的那種錯。
      - name: 驗證關卡唯一解
        run: npm run verify

  ios:
    name: iOS（實機，未簽章 IPA）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # ios/ 沒有進版控，每次都重新產生。這樣 CI 驗證的是「從乾淨的 repo
      # 能不能長出可編譯的 iOS 專案」，而不是某一份陳年的 scaffold。
      - name: 產生 iOS 專案
        run: npx cap add ios

      - name: 同步網頁資源與外掛
        run: npx cap sync ios

      # AdMob 的 App ID 少了會讓 App 一啟動就 crash，不是廣告不出現而已。
      # ATT 的說明文字在 iOS 14+ 沒有的話，requestTrackingAuthorization
      # 會直接被系統拒絕。這裡填的是 Google 官方測試 App ID。
      - name: 寫入 AdMob 設定
        run: |
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c \
            "Add :GADApplicationIdentifier string ca-app-pub-3940256099942544~1458002511" "$PLIST"
          /usr/libexec/PlistBuddy -c \
            "Add :NSUserTrackingUsageDescription string 這項權限用來提供與你更相關的廣告。拒絕不影響遊戲。" "$PLIST"
      # 用 -workspace 而不是 -project：CocoaPods 產生的 workspace 才含有
      # Pods 專案，直接開 .xcodeproj 會找不到 Capacitor 與 Ads 的 framework。
      #
      # 三個 CODE_SIGN* 都要關。只設 CODE_SIGNING_ALLOWED=NO 不夠，Xcode 仍會
      # 去找 signing identity，然後在沒有憑證的 runner 上失敗。
      - name: 編譯（arm64 實機）
        run: |
          xcodebuild             -workspace ios/App/App.xcworkspace             -scheme App             -configuration Release             -sdk iphoneos             -derivedDataPath build             CODE_SIGN_IDENTITY=""             CODE_SIGNING_REQUIRED=NO             CODE_SIGNING_ALLOWED=NO             build

      # IPA 的本體就是一個 zip：頂層一個 Payload/ 目錄，裡面放 .app。
      # 不用 xcodebuild -exportArchive，是因為匯出一定要有 provisioning
      # profile；手工打包才能完全不碰憑證。
      - name: 打包成 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr Corgidoku-unsigned.ipa Payload
          ls -lh Corgidoku-unsigned.ipa

      - name: 上傳 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Corgidoku-unsigned-ipa
          path: Corgidoku-unsigned.ipa
          # 未簽章的 IPA 沒有長期保存價值，每次 push 都會有新的一顆
          retention-days: 14

  pages:
    name: 部署網頁版到 GitHub Pages
    # 型別與關卡驗證沒過就不該把東西丟上線
    needs: web
    # 只有 main 才部署。PR 也跑 build.yml，但不該蓋掉線上版本
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # enablement 會在 repo 還沒開 Pages 時自動開起來，省掉去
      # Settings 手動設定的那一步
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - run: npm ci

      # vite.config.ts 的 base 是 './'，資源走相對路徑，所以放在
      # /corgiGame/ 這種子路徑底下也找得到——那個設定原本是為了
      # Capacitor 的 file:// WebView，這裡剛好一併受益
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
